<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Math Game</title>
</head>
<body>
    <h2>Math Game — Login</h2>

    <!-- Display flash messages (e.g. "Invalid username or password") -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p style="color: red;">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
        <!-- CSRF token — required by Flask-WTF's global CSRFProtect. -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required autofocus><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Log In</button>
    </form>
</body>
</html>
