<div class="avatar-preview-shell" data-avatar-preview>
  <div class="avatar-stage-wrap" data-gear-avatar-composite-region>
    <div class="avatar-stage">
      {% for layer_key in ['head-back', 'chest-underlay', 'body-upper', 'body-lower', 'boots', 'main-hand', 'chest', 'face', 'head-front', 'off-hand', 'off-hand-base'] %}
        {% set layer = gear_avatar.layer_map.get(layer_key) %}
        <div data-avatar-layer-region="{{ layer_key }}">
          {% if layer %}
            <img
              class="avatar-layer"
              data-avatar-layer-label="{{ layer.label }}"
              src="{{ layer.static_path }}"
              alt="{{ layer.label }}"
            >
          {% endif %}
        </div>
      {% endfor %}
    </div>
  </div>

  <div class="avatar-face-controls" data-gear-face-controls-region>
    <form method="POST" action="{{ url_for('player.avatar_face') }}" data-gear-shell-form>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="direction" value="prev">
      <input type="hidden" name="gear_filter" value="{{ gear_filter }}">
      <input type="hidden" name="selected_item" value="{{ gear_selected_item.id if gear_selected_item else '' }}">
      <button type="submit" class="btn btn-secondary btn-small">Previous</button>
    </form>
    <div class="avatar-face-label" data-avatar-face-key="{{ gear_avatar.selected_face_key }}" data-avatar-face-label-region>
      {{ gear_avatar.face_label }}
    </div>
    <form method="POST" action="{{ url_for('player.avatar_face') }}" data-gear-shell-form>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="direction" value="next">
      <input type="hidden" name="gear_filter" value="{{ gear_filter }}">
      <input type="hidden" name="selected_item" value="{{ gear_selected_item.id if gear_selected_item else '' }}">
      <button type="submit" class="btn btn-secondary btn-small">Next</button>
    </form>
  </div>
</div>
