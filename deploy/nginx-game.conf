server {
    listen 80;
    listen [::]:80;
    server_name game.korephysics.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/korephysics-acme; }
    location / { return 301 https://game.korephysics.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name game.korephysics.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/game.korephysics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.korephysics.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128m;
    access_log /var/log/nginx/korephysics-game-access.log korephysics;
    error_log /var/log/nginx/korephysics-game-error.log warn;
    proxy_set_header Host game.korephysics.com;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    location /socket.io {
        proxy_pass http://127.0.0.1:5060;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location / { proxy_pass http://127.0.0.1:5060; }
}
