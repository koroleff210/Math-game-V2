# First certificate issuance only; switch to nginx-game.conf after certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name game.korephysics.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/korephysics-acme; }
    location / { return 503; }
}
